x-app: &app
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DB_ENABLED: "true"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: events
    DB_USER: events
    DB_PASSWORD: events_dev

services:
  event-service:
    <<: *app
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    ports:
      - "${EVENT_PORT:-3001}:3000"

  ticket-service:
    <<: *app
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    ports:
      - "${TICKET_PORT:-3002}:3000"

  registration-service:
    <<: *app
    build:
      context: .
      dockerfile: services/registration-service/Dockerfile
    ports:
      - "${REGISTRATION_PORT:-3003}:3000"

  payment-service:
    <<: *app
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "${PAYMENT_PORT:-3004}:3000"

  notification-service:
    <<: *app
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "${NOTIFICATION_PORT:-3005}:3000"

  toolbox:
    build:
      context: .
      dockerfile: devops/Dockerfile
      args:
        TERRAFORM_VERSION: "1.13.5"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ~/.aws:/root/.aws
      - ~/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AWS_PAGER: ""
      TF_IN_AUTOMATION: "false"
    stdin_open: true
    tty: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
